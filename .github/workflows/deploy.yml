name: Deploy Rivoct Sandbox

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: rivoct-sandbox
  REGION: asia-south1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Enable Corepack
        run: corepack enable
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build all packages
        run: pnpm -r run build
      
      - name: Run lint
        run: pnpm -r run lint || true
      
      - name: Type check
        run: pnpm -r exec tsc --noEmit || true

  deploy-functions:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Enable Corepack
        run: corepack enable
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Build functions
        run: |
          pnpm install
          pnpm --filter @rivoct/shared run build
          pnpm --filter @rivoct/functions run build
      
      - name: Deploy to Firebase
        run: firebase deploy --only functions --project $PROJECT_ID

  deploy-hosting:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Enable Corepack
        run: corepack enable
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Build web
        run: |
          pnpm install
          pnpm --filter @rivoct/web run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: rivoct-sandbox.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: rivoct-sandbox
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: rivoct-sandbox.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NEXT_PUBLIC_RATE_LIMIT_MINUTE: 5
          NEXT_PUBLIC_RATE_LIMIT_DAY: 100
          NEXT_PUBLIC_RATE_LIMIT_MONTH: 1000
      
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project $PROJECT_ID

  smoke-test:
    needs: [deploy-functions, deploy-hosting]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run smoke tests
        env:
          RIVOCT_API_KEY: ${{ secrets.RIVOCT_TEST_API_KEY }}
        run: bash tools/smoke-test.sh
