<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" fill="none">
  <title>Rivoct</title>
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon: Stylized R with signal waves -->
  <g id="icon">
    <!-- R letter base -->
    <path d="M8 12 L8 36 L20 36 C24 36 28 32 28 28 C28 24 24 20 20 20 L8 20" 
          stroke="url(#logoGradient)" 
          stroke-width="2.5" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- R diagonal leg -->
    <path d="M18 20 L26 36" 
          stroke="url(#logoGradient)" 
          stroke-width="2.5" 
          stroke-linecap="round"/>
    <!-- Signal waves -->
    <circle cx="36" cy="24" r="2" fill="#00ff87" opacity="0.8"/>
    <circle cx="36" cy="24" r="5" stroke="#00ff87" stroke-width="1" fill="none" opacity="0.4"/>
    <circle cx="36" cy="24" r="8" stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.2"/>
  </g>
  <!-- Text: RIVOCT -->
  <text x="48" y="32" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="24" 
        font-weight="700" 
        letter-spacing="0.05em"
        fill="white">RIVOCT</text>
</svg>
